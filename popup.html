<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Browser Summarizer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon32.png" alt="AI Browser Summarizer logo" class="logo" />
        <div class="brand-text">
          <h1>AI Browser Summarizer</h1>
          <span class="tagline">Instant page summaries, powered by Gemini</span>
        </div>
      </div>
      <button id="darkModeToggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <span id="darkModeIcon">🌙</span>
      </button>
    </header>

    <!-- Mode selection buttons -->
    <section class="mode-buttons">
      <button class="mode-btn" data-mode="short">
        <span class="mode-icon">⚡</span> Short
      </button>
      <button class="mode-btn" data-mode="bullets">
        <span class="mode-icon">📝</span> Bullets
      </button>
      <button class="mode-btn" data-mode="detailed">
        <span class="mode-icon">📖</span> Detailed
      </button>
    </section>

    <!-- Loading state -->
    <div id="loadingState" class="loading-state hidden">
      <div class="spinner"></div>
      <p id="loadingText">Reading the page…</p>
    </div>

    <!-- Error state -->
    <div id="errorState" class="error-state hidden">
      <span class="error-icon">⚠️</span>
      <p id="errorText">Something went wrong.</p>
    </div>

    <!-- Summary result -->
    <section id="resultState" class="result-state hidden">
      <div class="result-meta">
        <span id="sourceTitle" class="source-title"></span>
      </div>

      <div class="summary-box">
        <p id="summaryText"></p>
      </div>

      <div class="stats-row">
        <span id="charCount">0 characters</span>
        <span class="dot">•</span>
        <span id="readingTime">0 min read</span>
      </div>

      <div class="action-buttons">
        <button id="copyBtn" class="secondary-btn">📋 Copy</button>
        <button id="downloadBtn" class="secondary-btn">⬇️ Download</button>
        <button id="clearBtn" class="secondary-btn danger">🗑️ Clear</button>
      </div>
    </section>

    <!-- Empty state (first load, nothing generated yet) -->
    <div id="emptyState" class="empty-state">
      <span class="empty-icon">✨</span>
      <p>Pick a summary style above to get started.</p>
    </div>

    <!-- History -->
    <section class="history-section">
      <button id="historyToggle" class="history-toggle">
        <span>🕘 Recent Summaries</span>
        <span id="historyChevron">▾</span>
      </button>
      <ul id="historyList" class="history-list hidden"></ul>
    </section>

  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
